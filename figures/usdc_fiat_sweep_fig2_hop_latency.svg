<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" style="background:transparent">
  <title>Per-hop latency per tranche: send, Coinbase credit, fiat spendable</title>
  <text x="320.0" y="24" text-anchor="middle" font-size="16" font-family="sans-serif">Fiat spendable lands within two minutes of the send</text>
  <text x="82" y="54" text-anchor="end" font-size="11" font-family="sans-serif">full-1</text>  <rect x="90" y="40" width="0.6" height="14" fill="#1a6ee0"/>  <rect x="90.6" y="40" width="0.0" height="14" fill="#e08a1a"/>  <text x="96.6" y="54" font-size="11" font-family="sans-serif">5s</text>
  <text x="82" y="78" text-anchor="end" font-size="11" font-family="sans-serif">level1-1</text>  <rect x="90" y="64" width="534.0" height="14" fill="#1a6ee0"/>  <rect x="624.0" y="64" width="0.0" height="14" fill="#e08a1a"/>  <text x="630.0" y="78" font-size="11" font-family="sans-serif">4341s</text>
  <text x="82" y="102" text-anchor="end" font-size="11" font-family="sans-serif">level1-2</text>  <rect x="90" y="88" width="347.6" height="14" fill="#1a6ee0"/>  <rect x="437.6" y="88" width="0.0" height="14" fill="#e08a1a"/>  <text x="443.6" y="102" font-size="11" font-family="sans-serif">2826s</text>
  <text x="82" y="126" text-anchor="end" font-size="11" font-family="sans-serif">level100-1</text>  <rect x="90" y="112" width="32.4" height="14" fill="#1a6ee0"/>  <rect x="122.4" y="112" width="0.0" height="14" fill="#e08a1a"/>  <text x="128.4" y="126" font-size="11" font-family="sans-serif">263s</text>
  <text x="82" y="150" text-anchor="end" font-size="11" font-family="sans-serif">level20-1</text>  <rect x="90" y="136" width="346.0" height="14" fill="#1a6ee0"/>  <rect x="436.0" y="136" width="0.0" height="14" fill="#e08a1a"/>  <text x="442.0" y="150" font-size="11" font-family="sans-serif">2813s</text>
  <text x="82" y="174" text-anchor="end" font-size="11" font-family="sans-serif">level20-2</text>  <rect x="90" y="160" width="29.0" height="14" fill="#1a6ee0"/>  <rect x="119.0" y="160" width="0.0" height="14" fill="#e08a1a"/>  <text x="125.0" y="174" font-size="11" font-family="sans-serif">236s</text>
  <text x="82" y="198" text-anchor="end" font-size="11" font-family="sans-serif">level5-1</text>  <rect x="90" y="184" width="346.9" height="14" fill="#1a6ee0"/>  <rect x="436.9" y="184" width="0.0" height="14" fill="#e08a1a"/>  <text x="442.9" y="198" font-size="11" font-family="sans-serif">2820s</text>
  <text x="82" y="222" text-anchor="end" font-size="11" font-family="sans-serif">level5-2</text>  <rect x="90" y="208" width="346.2" height="14" fill="#1a6ee0"/>  <rect x="436.2" y="208" width="0.0" height="14" fill="#e08a1a"/>  <text x="442.2" y="222" font-size="11" font-family="sans-serif">2814s</text>
  <rect x="90" y="344" width="12" height="12" fill="#1a6ee0"/>  <text x="108" y="354" font-size="11" font-family="sans-serif">send to Coinbase credit</text>  <rect x="270" y="344" width="12" height="12" fill="#e08a1a"/>  <text x="288" y="354" font-size="11" font-family="sans-serif">credit to fiat spendable</text>  <text x="357.0" y="392" text-anchor="middle" font-size="12" font-family="sans-serif">seconds per hop (stacked)</text></svg>
