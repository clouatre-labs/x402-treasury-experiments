name: Runner Watchdog

# Alerts when CI runs on the oci-arm self-hosted runner stall (queued > 20
# minutes). Logic lives in the central reusable workflow:
# clouatre-labs/.github/.github/workflows/runner-watchdog.yml

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  actions: read

jobs:
  watchdog:
    uses: clouatre-labs/.github/.github/workflows/runner-watchdog.yml@PLACEHOLDER_CENTRAL_SHA
